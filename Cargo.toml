[package]
name = "nib"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
ratatui-core = { version = "0.1", default-features = false, features = ["std"] }
ratatui-crossterm = { version = "0.1", default-features = false, features = ["crossterm_0_29"] }
ratatui-widgets = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
