[package]
name = "nib"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
unicode-width = "0.2.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
